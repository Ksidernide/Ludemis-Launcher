name: Publier Ludemis 1.42
on:
  push:
    branches: [main]
    paths: ['publication142/manifest.json', '.github/workflows/publish142.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ludemis-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstituer et vérifier l’exécutable officiel
        run: python3 publication142/assemble.py
      - name: Publier uniquement l’exécutable et son empreinte
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.42
          if gh release view "$tag" --json isDraft > existing142.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing142.json"))["isDraft"], "La release est déjà publique"'
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title 'Ludemis 1.42' --notes-file publication142/notes.md --draft
          fi
          gh release upload "$tag" Ludemis-1.42.exe SHA256SUMS.txt --clobber
          gh api "repos/$GH_REPO/releases" > releases142.json
          python3 -c 'import json; print(next(r["id"] for r in json.load(open("releases142.json")) if r["tag_name"]=="v1.42" and r["draft"]))' > release142-id.txt
          gh api "repos/$GH_REPO/releases/$(cat release142-id.txt)" > uploaded142.json
          python3 - <<'PY'
          import hashlib,json
          config=json.load(open('publication142/manifest.json'))
          uploaded=json.load(open('uploaded142.json'))['assets']
          assert {a['name'] for a in uploaded}=={config['name'],'SHA256SUMS.txt'}, 'Unexpected assets in release'
          for name in (config['name'],'SHA256SUMS.txt'):
              asset=next(a for a in uploaded if a['name']==name)
              raw=open(name,'rb').read()
              assert asset['size']==len(raw),name
              assert asset['digest']=='sha256:'+hashlib.sha256(raw).hexdigest(),name
          PY
          gh release edit "$tag" --notes-file publication142/notes.md --draft=false --latest
