name: Publier Ludemis
on:
  push:
    branches: [main]
    paths: ['publication/release.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ludemis-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assembler et vérifier l'exécutable
        shell: python
        run: |
          import gzip, hashlib, json, pathlib, zipfile
          config = json.loads(pathlib.Path('publication/release.json').read_text(encoding='utf-8'))
          parts = sorted(pathlib.Path('publication').glob('Ludemis.exe.gz.part*'))
          assert len(parts) == config['parts']
          data = gzip.decompress(b''.join(p.read_bytes() for p in parts))
          assert data[:2] == b'MZ' and len(data) == config['size']
          assert hashlib.sha256(data).hexdigest() == config['sha256']
          pathlib.Path('Ludemis.exe').write_bytes(data)
          zipfile.ZipFile('publication/validation.zip').extractall('validation')
      - name: Tester le remplacement et la relance sous Windows
        shell: powershell
        working-directory: validation
        run: ./test-installer.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester l'interface et le focus
        shell: bash
        working-directory: validation
        run: |
          npm install --no-save playwright@1.62.1
          LUDEMIS_CDP=1 node test-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-windows
          path: validation/*.png
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler et vérifier les fichiers de cette publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import gzip, hashlib, json, pathlib, re
          config = json.loads(pathlib.Path('publication/release.json').read_text())
          version = config['version']
          assert re.fullmatch(r'[0-9]{1,6}\.[0-9]{1,6}(?:\.[0-9]{1,6})?', version)
          parts = sorted(pathlib.Path('publication').glob('Ludemis.exe.gz.part*'))
          assert len(parts) == config['parts']
          data = gzip.decompress(b''.join(p.read_bytes() for p in parts))
          assert data[:2] == b'MZ' and len(data) == config['size']
          assert hashlib.sha256(data).hexdigest() == config['sha256']
          pathlib.Path('Ludemis-' + version + '.exe').write_bytes(data)
          pathlib.Path('version.txt').write_text(version)
          pathlib.Path('notes.txt').write_text(config['notes'])
          pathlib.Path('SHA256SUMS.txt').write_text(config['sha256'] + '  Ludemis-' + version + '.exe\n')
          PY
      - name: Publier après téléversement et vérification du digest GitHub
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat version.txt)"
          tag="v$version"
          if gh release view "$tag" --repo "$GH_REPO" --json isDraft > existing.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing.json"))["isDraft"], "Une release publiée existe déjà"'
          else
            gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Ludemis $version" --notes-file notes.txt --draft
          fi
          gh release upload "$tag" "Ludemis-$version.exe" SHA256SUMS.txt --repo "$GH_REPO" --clobber
          gh api "repos/$GH_REPO/releases/tags/$tag" > uploaded.json
          python3 - <<'PY'
          import json
          config=json.load(open('publication/release.json'))
          assets=json.load(open('uploaded.json'))['assets']
          asset=next(a for a in assets if a['name']=='Ludemis-'+config['version']+'.exe')
          assert asset['size']==config['size']
          assert asset['digest']=='sha256:'+config['sha256']
          PY
          gh release edit "$tag" --repo "$GH_REPO" --notes-file notes.txt --draft=false --latest
