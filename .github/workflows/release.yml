name: Publier Ludemis
on:
  push:
    branches: [main]
    paths: ['publication/release.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ludemis-publication
  cancel-in-progress: false
jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Assembler et vérifier l'exécutable
        shell: python
        run: |
          import runpy, zipfile
          runpy.run_path('publication/assemble.py')
          zipfile.ZipFile('publication/validation.zip').extractall('validation')
      - name: Tester le remplacement et la relance sous Windows
        shell: powershell
        working-directory: validation
        run: ./test-installer.ps1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester l'interface et le focus
        shell: bash
        working-directory: validation
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium
          node test-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-windows
          path: validation/*.png
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Assembler et vérifier les fichiers de cette publication
        shell: bash
        run: |
          set -euo pipefail
          python3 publication/assemble.py
      - name: Publier après téléversement et vérification du digest GitHub
        shell: bash
        run: |
          set -euo pipefail
          version="$(cat version.txt)"
          tag="v$version"
          if gh release view "$tag" --repo "$GH_REPO" --json isDraft > existing.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing.json"))["isDraft"], "Une release publiée existe déjà"'
          else
            gh release create "$tag" --repo "$GH_REPO" --target "$GITHUB_SHA" --title "Ludemis $version" --notes-file notes.txt --draft
          fi
          gh release upload "$tag" "Ludemis-$version.exe" SHA256SUMS.txt --repo "$GH_REPO" --clobber
          gh api "repos/$GH_REPO/releases" > release-list.json
          python3 -c 'import json; config=json.load(open("publication/release.json")); print(next(r["id"] for r in json.load(open("release-list.json")) if r["tag_name"]=="v"+config["version"] and r["draft"]))' > release-id.txt
          gh api "repos/$GH_REPO/releases/$(cat release-id.txt)" > uploaded.json
          python3 - <<'PY'
          import json
          config=json.load(open('publication/release.json'))
          assets=json.load(open('uploaded.json'))['assets']
          asset=next(a for a in assets if a['name']=='Ludemis-'+config['version']+'.exe')
          assert asset['size']==config['size']
          assert asset['digest']=='sha256:'+config['sha256']
          PY
          gh release edit "$tag" --repo "$GH_REPO" --notes-file notes.txt --draft=false --latest
