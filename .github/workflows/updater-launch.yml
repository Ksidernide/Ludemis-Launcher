name: Diagnostiquer le lancement des mises à jour
on:
  push:
    branches: [main]
    paths: ['publication/launch-check/**', '.github/workflows/updater-launch.yml']
permissions:
  contents: read
jobs:
  launch:
    runs-on: windows-2022
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
      - name: Tester les modes de lancement PowerShell depuis Go
        shell: powershell
        env:
          GO111MODULE: 'off'
        run: go test -v ./publication/launch-check
