name: Publier Ludemis 1.26
on:
  push:
    branches: [main]
    paths: ['publication126/manifest.json', '.github/workflows/publish126.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ludemis-publication
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - name: Reconstituer et vérifier l’exécutable officiel
        run: python3 publication126/assemble.py
      - name: Publier uniquement l’exécutable et son empreinte
        shell: bash
        run: |
          set -euo pipefail
          tag=v1.26
          if gh release view "$tag" --json isDraft > existing126.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("existing126.json"))["isDraft"], "La release est déjà publique"'
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title 'Ludemis 1.26' --notes-file publication126/notes.md --draft
          fi
          gh release upload "$tag" Ludemis-1.26.exe SHA256SUMS.txt --clobber
          gh api "repos/$GH_REPO/releases" > releases126.json
          python3 -c 'import json; print(next(r["id"] for r in json.load(open("releases126.json")) if r["tag_name"]=="v1.26" and r["draft"]))' > release126-id.txt
          gh api "repos/$GH_REPO/releases/$(cat release126-id.txt)" > uploaded126.json
          python3 - <<'PY'
          import hashlib,json
          config=json.load(open('publication126/manifest.json'))
          uploaded=json.load(open('uploaded126.json'))['assets']
          assert {a['name'] for a in uploaded}=={config['name'],'SHA256SUMS.txt'}, 'Unexpected assets in release'
          for name in (config['name'],'SHA256SUMS.txt'):
              asset=next(a for a in uploaded if a['name']==name)
              raw=open(name,'rb').read()
              assert asset['size']==len(raw),name
              assert asset['digest']=='sha256:'+hashlib.sha256(raw).hexdigest(),name
          PY
          gh release edit "$tag" --notes-file publication126/notes.md --draft=false --latest
